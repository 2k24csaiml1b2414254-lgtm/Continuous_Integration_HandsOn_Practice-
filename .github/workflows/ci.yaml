namme : CI workflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main


jobs:
  test:
    runs_on: ubuntu-latest


    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          pytohn-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade
          pip install pytest streamlit

      - name: Run tests
        run: |
          pytest_test.py

      - name: Run tests
        run: |
          pytest _test.py


